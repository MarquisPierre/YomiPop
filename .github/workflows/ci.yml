# Checks every push and pull request: lint, formatting, types, tests and builds,
# as the build plan's "proof of quality" section asks.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Starts a throwaway Postgres for the API tests, as the build plan suggests.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: yomipop_test
        ports: ["5432:5432"]
        # Waits until Postgres accepts connections before the steps start.
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/yomipop_test
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/yomipop_test
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 24, the version the app needs
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install packages exactly as locked
        run: npm ci

      - name: Generate the Prisma client the API's code imports
        run: npx prisma generate
        working-directory: apps/api

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check the API and extension
        run: npm run typecheck

      - name: Run the tests
        run: npm test

      # Building the website also type-checks it.
      - name: Build everything
        run: |
          npm run build -w apps/api
          npm run build -w apps/web
          npm run build -w apps/extension
