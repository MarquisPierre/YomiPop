<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>YomiPop</title>
    <style>
      body {
        width: 220px;
        margin: 0;
        padding: 12px;
        font:
          14px system-ui,
          sans-serif;
        background: #1f2328;
        color: #f0f3f6;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 16px;
      }
      fieldset {
        margin: 0;
        padding: 0;
        border: none;
      }
      legend {
        margin-bottom: 6px;
        color: #9fb3c8;
      }
      label {
        display: block;
        padding: 4px 0;
        cursor: pointer;
      }
      .account {
        margin-bottom: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid #3a4048;
        color: #9fb3c8;
      }
      .account p {
        margin: 0;
      }
      button {
        display: block;
        width: 100%;
        margin-top: 6px;
        padding: 6px;
        border: none;
        border-radius: 6px;
        background: #f0f3f6;
        color: #1f2328;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>YomiPop</h1>
    <div class="account">
      <p id="account-status">Checking login…</p>
      <button id="log-in" hidden>Log in</button>
      <button id="log-out" hidden>Log out</button>
    </div>
    <fieldset>
      <legend>Show pop-up on</legend>
      <label
        ><input type="radio" name="trigger" value="shift" /> Shift +
        hover</label
      >
      <label><input type="radio" name="trigger" value="hover" /> Hover</label>
    </fieldset>
    <script type="module" src="./menu.ts"></script>
  </body>
</html>
