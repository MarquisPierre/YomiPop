<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>YomiPop</title>
    <style>
      body {
        width: 220px;
        margin: 0;
        padding: 12px;
        font:
          14px system-ui,
          sans-serif;
        background: #1f2328;
        color: #f0f3f6;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 16px;
      }
      fieldset {
        margin: 0;
        padding: 0;
        border: none;
      }
      legend {
        margin-bottom: 6px;
        color: #9fb3c8;
      }
      label {
        display: block;
        padding: 4px 0;
        cursor: pointer;
      }
      .account {
        margin-bottom: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid #3a4048;
        color: #9fb3c8;
      }
      .account p {
        margin: 0;
      }
      button {
        display: block;
        width: 100%;
        margin-top: 6px;
        padding: 6px;
        border: none;
        border-radius: 6px;
        background: #f0f3f6;
        color: #1f2328;
        font: inherit;
        cursor: pointer;
      }
      .review {
        margin: 10px 0 0;
        color: #f0f3f6;
      }
      /* Puts the deck dropdown on its own line under its label. */
      .deck {
        margin-top: 10px;
        color: #9fb3c8;
      }
      .deck select {
        display: block;
        width: 100%;
        margin-top: 4px;
        padding: 4px;
        border-radius: 6px;
        font: inherit;
      }
      /* Keeps the credit small and quiet under the settings. */
      .credit {
        margin: 12px 0 0;
        font-size: 11px;
        color: #9fb3c8;
      }
      .credit a {
        color: inherit;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>YomiPop</h1>
    <div class="account">
      <p id="account-status">Checking login…</p>
      <p id="review-status" class="review" hidden></p>
      <button id="start-review" hidden>Start review</button>
      <label id="deck-picker" class="deck" hidden>
        Add new words to
        <select id="deck"></select>
      </label>
      <button id="log-in" hidden>Log in</button>
      <button id="log-out" hidden>Log out</button>
    </div>
    <fieldset>
      <legend>Show pop-up on</legend>
      <label
        ><input type="radio" name="trigger" value="shift" /> Shift +
        hover</label
      >
      <label><input type="radio" name="trigger" value="hover" /> Hover</label>
    </fieldset>
    <!-- Credits the dictionary, as its licence requires. -->
    <p class="credit">
      Dictionary data from
      <a href="https://www.edrdg.org/edrdg/licence.html" target="_blank"
        >JMdict</a
      >
      by the EDRDG, under CC BY-SA 4.0.
    </p>
    <script type="module" src="./menu.ts"></script>
  </body>
</html>
